<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration einer Drohne, die ein Restaurantgebäude fotografiert">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2419"/>
      <stop offset="100%" stop-color="#0a0e0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c877"/>
      <stop offset="100%" stop-color="#9c7c34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- building silhouette -->
  <g fill="#131a12" stroke="#3a4a34" stroke-width="2">
    <rect x="180" y="380" width="440" height="160"/>
    <rect x="230" y="330" width="120" height="50"/>
    <polygon points="180,380 400,300 620,380"/>
  </g>
  <g fill="#c8a04d" opacity="0.85">
    <rect x="220" y="420" width="40" height="60" rx="4"/>
    <rect x="290" y="420" width="40" height="60" rx="4"/>
    <rect x="470" y="420" width="40" height="60" rx="4"/>
    <rect x="540" y="420" width="40" height="60" rx="4"/>
  </g>

  <!-- drone -->
  <g transform="translate(430,180)">
    <line x1="-70" y1="-40" x2="70" y2="40" stroke="#c8a04d" stroke-width="4"/>
    <line x1="70" y1="-40" x2="-70" y2="40" stroke="#c8a04d" stroke-width="4"/>
    <circle cx="-70" cy="-40" r="20" fill="none" stroke="#e8c877" stroke-width="4"/>
    <circle cx="70" cy="-40" r="20" fill="none" stroke="#e8c877" stroke-width="4"/>
    <circle cx="-70" cy="40" r="20" fill="none" stroke="#e8c877" stroke-width="4"/>
    <circle cx="70" cy="40" r="20" fill="none" stroke="#e8c877" stroke-width="4"/>
    <rect x="-26" y="-16" width="52" height="32" rx="8" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="9" fill="#0a0e0a"/>
  </g>

  <!-- camera line down to building + focus brackets -->
  <line x1="430" y1="216" x2="400" y2="360" stroke="#e8c877" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.7"/>
  <g stroke="#e8c877" stroke-width="3" fill="none" opacity="0.85">
    <path d="M350 320 v-20 h20"/>
    <path d="M450 320 v-20 h-20"/>
    <path d="M350 400 v20 h20"/>
    <path d="M450 400 v20 h-20"/>
  </g>
</svg>
