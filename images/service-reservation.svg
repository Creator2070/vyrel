<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration einer Online-Tischreservierung mit Kalender und Bestätigungshaken">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2419"/>
      <stop offset="100%" stop-color="#0a0e0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c877"/>
      <stop offset="100%" stop-color="#9c7c34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- table from above -->
  <g transform="translate(230,320)">
    <ellipse rx="130" ry="90" fill="#131a12" stroke="#3a4a34" stroke-width="2"/>
    <circle r="46" fill="url(#gold)" opacity="0.9"/>
    <rect x="-60" y="-6" width="40" height="12" rx="6" fill="#f8f7f3" opacity="0.85"/>
    <rect x="20" y="-6" width="40" height="12" rx="6" fill="#f8f7f3" opacity="0.85"/>
  </g>

  <!-- calendar card -->
  <g transform="translate(430,150)">
    <rect width="260" height="240" rx="18" fill="#f8f7f3"/>
    <rect width="260" height="54" rx="18" fill="#c8a04d"/>
    <rect y="36" width="260" height="18" fill="#c8a04d"/>
    <rect x="24" y="20" width="60" height="14" rx="4" fill="#0a0e0a" opacity="0.8"/>

    <g fill="#e4e1d6">
      <rect x="24" y="80" width="30" height="30" rx="6"/>
      <rect x="64" y="80" width="30" height="30" rx="6"/>
      <rect x="104" y="80" width="30" height="30" rx="6"/>
      <rect x="144" y="80" width="30" height="30" rx="6"/>
      <rect x="184" y="80" width="30" height="30" rx="6"/>

      <rect x="24" y="120" width="30" height="30" rx="6"/>
      <rect x="64" y="120" width="30" height="30" rx="6"/>
      <rect x="144" y="120" width="30" height="30" rx="6"/>
      <rect x="184" y="120" width="30" height="30" rx="6"/>

      <rect x="24" y="160" width="30" height="30" rx="6"/>
      <rect x="64" y="160" width="30" height="30" rx="6"/>
      <rect x="104" y="160" width="30" height="30" rx="6"/>
      <rect x="184" y="160" width="30" height="30" rx="6"/>
    </g>
    <rect x="104" y="120" width="30" height="30" rx="6" fill="#c8a04d"/>
    <path d="M112 135 l7 8 l14 -16" stroke="#0a0e0a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="144" y="160" width="30" height="30" rx="6" fill="none" stroke="#c8a04d" stroke-width="2"/>
  </g>

  <!-- check badge -->
  <g transform="translate(560,420)">
    <circle r="46" fill="url(#gold)"/>
    <path d="M-18 0 l12 14 l24 -28" stroke="#0a0e0a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
