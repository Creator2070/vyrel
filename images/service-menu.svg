<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration eines digitalen Speiseplans mit QR-Code auf einem Smartphone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2419"/>
      <stop offset="100%" stop-color="#0a0e0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c877"/>
      <stop offset="100%" stop-color="#9c7c34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- phone -->
  <rect x="300" y="90" width="200" height="420" rx="28" fill="#131a12" stroke="#c8a04d" stroke-width="2"/>
  <rect x="316" y="120" width="168" height="360" rx="6" fill="#f8f7f3"/>
  <rect x="360" y="98" width="80" height="10" rx="5" fill="#0a0e0a"/>

  <!-- menu header -->
  <rect x="332" y="140" width="136" height="14" rx="4" fill="#1a1f1a"/>
  <rect x="332" y="160" width="90" height="8" rx="4" fill="#9aa196"/>

  <!-- menu list rows -->
  <g>
    <rect x="332" y="188" width="136" height="1" fill="#e4e1d6"/>
    <rect x="332" y="198" width="80" height="10" rx="4" fill="#1a1f1a"/>
    <rect x="332" y="212" width="110" height="7" rx="3" fill="#9aa196"/>
    <rect x="440" y="198" width="28" height="10" rx="4" fill="#9c7c34"/>

    <rect x="332" y="238" width="136" height="1" fill="#e4e1d6"/>
    <rect x="332" y="248" width="70" height="10" rx="4" fill="#1a1f1a"/>
    <rect x="332" y="262" width="120" height="7" rx="3" fill="#9aa196"/>
    <rect x="440" y="248" width="28" height="10" rx="4" fill="#9c7c34"/>

    <rect x="332" y="288" width="136" height="1" fill="#e4e1d6"/>
    <rect x="332" y="298" width="90" height="10" rx="4" fill="#1a1f1a"/>
    <rect x="332" y="312" width="100" height="7" rx="3" fill="#9aa196"/>
    <rect x="440" y="298" width="28" height="10" rx="4" fill="#9c7c34"/>
  </g>

  <!-- QR code block -->
  <g transform="translate(332,346)">
    <rect width="80" height="80" rx="6" fill="#1a1f1a"/>
    <g fill="#f8f7f3">
      <rect x="8" y="8" width="18" height="18"/>
      <rect x="54" y="8" width="18" height="18"/>
      <rect x="8" y="54" width="18" height="18"/>
      <rect x="34" y="10" width="8" height="8"/>
      <rect x="34" y="34" width="10" height="10"/>
      <rect x="50" y="40" width="8" height="8"/>
      <rect x="34" y="54" width="8" height="20"/>
      <rect x="56" y="56" width="16" height="8"/>
      <rect x="12" y="12" width="10" height="10" fill="#1a1f1a"/>
      <rect x="58" y="12" width="10" height="10" fill="#1a1f1a"/>
      <rect x="12" y="58" width="10" height="10" fill="#1a1f1a"/>
    </g>
  </g>

  <!-- floating gold accent ring behind phone -->
  <circle cx="400" cy="300" r="220" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.35"/>
</svg>
