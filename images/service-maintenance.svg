<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration von Website-Betreuung und Wartung mit Zahnrad, Schutzschild und Statusanzeige">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2419"/>
      <stop offset="100%" stop-color="#0a0e0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c877"/>
      <stop offset="100%" stop-color="#9c7c34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- shield -->
  <g transform="translate(320,300)">
    <path d="M0 -140 C70 -110 140 -100 140 -100 C140 20 70 110 0 150 C-70 110 -140 20 -140 -100 C-140 -100 -70 -110 0 -140 Z" fill="#131a12" stroke="url(#gold)" stroke-width="4"/>
    <path d="M-38 -6 L-10 26 L46 -46" stroke="#e8c877" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- gear -->
  <g transform="translate(560,220)">
    <g fill="url(#gold)">
      <circle r="70"/>
      <g>
        <rect x="-12" y="-96" width="24" height="34" rx="6"/>
        <rect x="-12" y="62" width="24" height="34" rx="6"/>
        <rect x="-96" y="-12" width="34" height="24" rx="6"/>
        <rect x="62" y="-12" width="34" height="24" rx="6"/>
        <g transform="rotate(45)">
          <rect x="-12" y="-96" width="24" height="34" rx="6"/>
          <rect x="-12" y="62" width="24" height="34" rx="6"/>
          <rect x="-96" y="-12" width="34" height="24" rx="6"/>
          <rect x="62" y="-12" width="34" height="24" rx="6"/>
        </g>
      </g>
    </g>
    <circle r="30" fill="#0a0e0a"/>
  </g>

  <!-- status pulse line -->
  <g transform="translate(160,470)" stroke="#e8c877" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 H90 L120 -50 L160 60 L190 -20 L220 20 H540"/>
  </g>
  <circle cx="700" cy="470" r="10" fill="#e8c877"/>
  <circle cx="700" cy="470" r="20" fill="none" stroke="#e8c877" stroke-width="2" opacity="0.5"/>
</svg>
